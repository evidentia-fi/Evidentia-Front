version: '3'

services:
  app-evidentia-mint-dev:
    container_name: app-evidentia-mint-dev
    image: registry.int.zpoken.io/evidentia/front/mint-dev:dev
    build:
      context: .
      dockerfile: ./apps/mint/Dockerfile
      args:
        NODE: development
    restart: always
    ports:
      - 4005:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://app-evidentia-mint-dev:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  app-evidentia-dev:
    container_name: app-evidentia-dev
    image: registry.int.zpoken.io/evidentia/front/app-dev:dev
    build:
      context: .
      dockerfile: ./apps/app/Dockerfile
      args:
        NODE: development
    restart: always
    ports:
      - 4002:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://app-evidentia-dev:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

