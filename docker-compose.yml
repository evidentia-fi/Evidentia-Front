  #  app
  app-evidentia:
    container_name: app-evidentia
    image: registry.int.zpoken.io/evidentia/front/app-prod:${TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/app/Dockerfile
      args:
        NODE: production
    restart: always
    ports:
      - 4001:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://app-evidentia:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  app-evidentia-mint:
    container_name: app-evidentia-mint
    image: registry.int.zpoken.io/evidentia/front/mint-prod:${TAG:-latest}
    build:
      context: .
      dockerfile: ./apps/mint/Dockerfile
      args:
        NODE: production
    restart: always
    ports:
      - 4004:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://app-evidentia-mint:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
